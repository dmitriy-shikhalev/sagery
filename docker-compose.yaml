version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db_sagery
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sagery
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: